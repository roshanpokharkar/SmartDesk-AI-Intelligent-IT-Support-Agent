{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block auth %}
<div class="auth-card">
  <div class="brand big"><span class="logo">S</span> SmartDesk <em>AI</em></div>
  <p class="muted">Create your account to start solving IT problems.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Full name<input name="name" value="{{ name or '' }}" required maxlength="60" autofocus></label>
    <label>Email<input type="email" name="email" value="{{ email or '' }}" required></label>
    <label>Password<input type="password" name="password" required minlength="8">
      <small class="muted">At least 8 characters with a letter and a number.</small></label>
    <label>Confirm password<input type="password" name="confirm" required></label>
    <button class="btn full">Create account</button>
  </form>
  <p class="muted center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
